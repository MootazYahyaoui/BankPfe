---
- name: Docker sur Debian / Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_facts.os_family == "Debian"

- name: Docker sur RHEL compatible (Rocky, Alma, CentOS Stream, RHEL)
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts.os_family == "RedHat"

- name: Distribution non prise en charge par le rôle docker
  ansible.builtin.fail:
    msg: >-
      OS non supporté : {{ ansible_facts.distribution }}
      (famille {{ ansible_facts.os_family }}).
      Étendre roles/docker pour cette plateforme.
  when:
    - ansible_facts.os_family not in ['Debian', 'RedHat']

- name: Activer et démarrer le service Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur SSH au groupe docker (hors root)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when:
    - ansible_user is defined
    - ansible_user | length > 0
    - ansible_user != "root"
