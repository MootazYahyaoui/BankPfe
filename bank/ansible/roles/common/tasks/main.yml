---
- name: Rafraîchir les métadonnées apt (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Paquets de base pour admin et diagnostics
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - apt-transport-https
      - software-properties-common
      - python3
      - python3-apt
    state: present
  when: ansible_facts.os_family == "Debian"
