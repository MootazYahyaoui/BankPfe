server.port=8885
server.servlet.context-path=/bank
spring.application.name=AUTHENTICATION-SERVICE

# Base de données : MySQL/MariaDB (XAMPP : démarrer MySQL, port 3306, user root souvent sans mot de passe).
# H2 est UNIQUEMENT pour les tests Maven : src/test/resources/application-test.properties (profil "test" via Surefire).
# Ne pas définir SPRING_PROFILES_ACTIVE=test en local si vous voulez MySQL.
application.security.jwt.secret=${JWT_SECRET:AaZzBbCcYyDdXxEeWwFf}
application.security.jwt.expiration=${JWT_EXPIRATION:604800000}

#DATABASE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PWD:}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:db_user_new_devs_nours}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka/}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8886}

#ACTUATOR
management.endpoints.web.exposure.include=*
management.health.db.enabled=false
