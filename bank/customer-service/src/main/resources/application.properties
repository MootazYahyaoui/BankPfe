# ========================
# SERVER
# ========================
server.port=8886
server.servlet.context-path=/bank

# ========================
# APPLICATION
# ========================
spring.application.name=CUSTOMER-SERVICE

# ========================
# MYSQL (XAMPP : MySQL actif sur localhost:3306 — H2 uniquement en mvn test, voir application-test.properties)
# ========================
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PWD:}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:customer_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# MICROSERVICES (EUREKA)
# ========================
spring.cloud.discovery.enabled=true
eureka.client.enabled=true
eureka.instance.preferIpAddress=true
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE:http://localhost:8761/eureka/}

# ========================
# DISABLE SECURITY (pour démarrage PFE)
# ========================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ========================
# JWT
# ========================
application.security.jwt.secret=${JWT_SECRET:AaZzBbCcYyDdXxEeWwFf}
application.security.jwt.expiration=${JWT_EXPIRATION:604800000}

# ========================
# ACTUATOR
# ========================
management.endpoints.web.exposure.include=*