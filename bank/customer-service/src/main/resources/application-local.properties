server.port=8886
server.servlet.context-path=/bank

spring.application.name=CUSTOMER-SERVICE

# MySQL (XAMPP) pour un comportement proche de l'environnement intégré
spring.datasource.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/customerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${CUSTOMER_DB_USERNAME:root}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Pas de microservices au début (on réactive plus tard)
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Désactiver sécurité pour PFE au début
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

management.endpoints.web.exposure.include=*
app.seed.customers.enabled=false
